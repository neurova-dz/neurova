{% extends "base.html" %}
{% block title %}Profile{% endblock %}
{% block page_heading %}Profile{% endblock %}
{% block content %}
<div class="nv-card nv-card-pad" style="max-width: 720px;">
  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="nv-form-grid nv-form-grid--2">
      <div class="nv-form-row">
        <label class="nv-form-label">Full name</label>
        <input class="nv-input" name="full_name" value="{{ current_user.full_name }}" maxlength="160" required>
      </div>
      <div class="nv-form-row">
        <label class="nv-form-label">Title</label>
        <input class="nv-input" name="title" value="{{ profile.title or '' }}" maxlength="80">
      </div>
    </div>
    <div class="nv-form-grid nv-form-grid--2">
      <div class="nv-form-row">
        <label class="nv-form-label">Phone</label>
        <input class="nv-input" name="phone" value="{{ profile.phone or '' }}" maxlength="40">
      </div>
      <div class="nv-form-row">
        <label class="nv-form-label">Locale</label>
        <input class="nv-input" name="locale" value="{{ profile.locale or '' }}" placeholder="en, fr, ar" maxlength="32">
      </div>
    </div>
    <div class="nv-form-row">
      <label class="nv-form-label">Specialty / workflow</label>
      <select class="nv-select" name="specialty">
        <option value="" {% if not profile.specialty %}selected{% endif %}>—</option>
        <option value="brain_tumor" {% if profile.specialty == 'brain_tumor' %}selected{% endif %}>Brain MRI / tumor</option>
        <option value="diabetic_retinopathy" {% if profile.specialty == 'diabetic_retinopathy' %}selected{% endif %}>Diabetic retinopathy</option>
      </select>
    </div>
    <button class="nv-btn nv-btn--primary">Save profile</button>
  </form>
</div>
{% endblock %}
