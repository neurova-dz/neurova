{% extends "base.html" %}
{% block title %}Server error{% endblock %}
{% block page_heading %}Something went wrong{% endblock %}
{% block content %}
<div class="nv-card nv-card-pad nv-empty-state">
  <h2 class="nv-card-title">Unexpected server error</h2>
  <p class="nv-muted mb-4">Please try again shortly. The engineering team can inspect Flask logs for a stack trace.</p>
  <a class="nv-btn nv-btn--primary" href="{{ url_for('site.dashboard') if current_user.is_authenticated else url_for('site.landing') }}">Home</a>
</div>
{% endblock %}
