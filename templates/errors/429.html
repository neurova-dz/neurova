{% extends "base.html" %}
{% block title %}Too many requests{% endblock %}
{% block page_heading %}Slow down{% endblock %}
{% block content %}
<div class="nv-card nv-card-pad nv-empty-state">
  <h2 class="nv-card-title">Too many requests</h2>
  <p class="nv-muted mb-4">You hit the per-minute rate limit. Please wait a moment and try again.</p>
  <a class="nv-btn nv-btn--primary" href="{{ url_for('index') }}">Continue</a>
</div>
{% endblock %}
